name: Deploy (Vite) to cPanel via SSH

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      # (Opcional) garante que a pasta existe e limpa a pasta remota antes do upload
      - name: Prepare remote dir (clean)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            mkdir -p "${{ secrets.SSH_REMOTE_DIR }}"
            rm -rf "${{ secrets.SSH_REMOTE_DIR }}"/*
            rm -rf "${{ secrets.SSH_REMOTE_DIR }}"/.[!.]*
            rm -rf "${{ secrets.SSH_REMOTE_DIR }}"/..?*

      - name: Upload dist via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "dist/*"
          target: ${{ secrets.SSH_REMOTE_DIR }}
          strip_components: 1
